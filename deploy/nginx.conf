# nginx reverse proxy for PixelBoost.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pixelboost
#   sudo ln -s /etc/nginx/sites-available/pixelboost /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The two settings that matter and are easy to miss:
#   client_max_body_size  -- nginx defaults to 1 MB and will reject phone photos
#   proxy_read_timeout    -- a 4x upscale of a 4 MP photo can take 60-90 s on CPU
#                            and the default 60 s turns that into a 504

upstream pixelboost {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name upscale.example.com;

    client_max_body_size 32m;
    client_body_timeout 120s;

    access_log /var/log/nginx/pixelboost.access.log;
    error_log  /var/log/nginx/pixelboost.error.log warn;

    gzip on;
    gzip_types application/json;

    location / {
        proxy_pass http://pixelboost;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Long-running jobs are polled, so keep their reads short.
    location /v1/jobs {
        proxy_pass http://pixelboost;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://pixelboost;
        access_log off;
    }
}
